name: arrow_game
description: "Arrow - a fast, playful swipe-the-arrow reflex game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Nunito bundled so google_fonts resolves it from assets (no runtime fetch;
    # works offline and in the headless-Chromium screenshot harness).
    - assets/fonts/
