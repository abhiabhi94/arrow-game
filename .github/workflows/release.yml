name: Release

# Builds the Play Store upload bundle (signed with the upload key kept in
# repository secrets) and publishes it as a workflow artifact — and, on a
# version tag, as a GitHub Release. See docs/release.md.
#
# Secrets live in the "release" GitHub environment (Settings → Environments →
# release), which also lets you require a reviewer before a build runs:
#   ANDROID_UPLOAD_KEYSTORE_BASE64    the upload .jks, base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  keystore password
#   ANDROID_UPLOAD_KEY_PASSWORD       key password
#   ANDROID_UPLOAD_KEY_ALIAS          key alias (optional, defaults to "upload")

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name override (pubspec "1.0.0" part); blank = pubspec
        required: false
      build_number:
        description: Version code override (pubspec "+N" part); blank = pubspec
        required: false

permissions:
  contents: write # attach the bundle to the GitHub Release on a tag push

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Play Store bundle
    runs-on: ubuntu-latest
    environment: release
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/release.md."
            exit 1
          fi

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution, the Android Gradle plugin and every
      # dependency between runs; the Dart AOT compile and R8 still run fresh.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # The same gates as CI, minus the coverage threshold: a release must
      # never ship from a red tree.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=$KEYSTORE_PATH
          PROPS

      - name: Resolve version
        id: version
        env:
          BUILD_NAME: ${{ github.event.inputs.build_name }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          pubspec=$(sed -n 's/^version: *//p' pubspec.yaml)
          name=${BUILD_NAME:-${pubspec%%+*}}
          number=${BUILD_NUMBER:-${pubspec##*+}}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Building $name ($number)" >> "$GITHUB_STEP_SUMMARY"

      # Obfuscated Dart with symbols split out so Play Console crash reports
      # can be symbolised; the R8 mapping.txt comes out of the same build.
      - name: Build app bundle
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
          --obfuscate --split-debug-info=build/symbols

      # A signed release APK of the same build for a device sanity check
      # before uploading the bundle (the bundle itself cannot be sideloaded).
      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
          --obfuscate --split-debug-info=build/symbols

      - name: Collect outputs
        id: outputs
        run: |
          v="${{ steps.version.outputs.name }}-${{ steps.version.outputs.number }}"
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/arrow-$v.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/arrow-$v.apk"
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "dist/arrow-$v-mapping.txt"
          fi
          (cd build/symbols && zip -qr "../../dist/arrow-$v-dart-symbols.zip" .)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-${{ steps.outputs.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Arrow ${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }})
          generate_release_notes: true
          files: dist/*

      - name: Remove signing material
        if: always()
        run: rm -f "$KEYSTORE_PATH" android/key.properties
