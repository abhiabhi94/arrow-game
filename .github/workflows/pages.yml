name: Deploy web app to GitHub Pages

# Publishes the release web build of the app to the repo's GitHub Pages site
# on every push to main. The build is committed to the root of the gh-pages
# branch; pull-request previews (pr-preview.yml) live in pr-preview/ on the
# same branch and are left alone here.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "Deploy from a branch", Branch: gh-pages / (root). The branch only
# appears in that dropdown after this workflow has run once.
#
# The site is served at https://<owner>.github.io/<repo>/, so the build needs
# that path as its base href; it is derived from the repo name below, which
# keeps this workflow copy-pasteable into other repos. For a custom domain
# (CNAME) or a user/organisation site, change BASE_HREF to "/".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # pushes the build to the gh-pages branch

# One deployment at a time; don't cancel a deploy that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Release = "Arrow" with locked progression, same as the store build.
      - name: Build web (release)
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
        run: |
          flutter build web --release --base-href "$BASE_HREF" --no-wasm-dry-run
          touch build/web/.nojekyll

      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview/
          # Rebase onto concurrent preview deploys instead of overwriting them.
          force: false
